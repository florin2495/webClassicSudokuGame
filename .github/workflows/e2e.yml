name: E2E

# Manual only (Actions tab > Run workflow, or `gh workflow run e2e.yml --ref main [-f base_url=...]`).
# HTTP checks of the deployed game (page, version, PWA files, service worker, feedback validation). Writes nothing.
# Run it on main after the Vercel deploy of that version finished (it checks the deployed JS has the package.json version).
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL including /classicsudoku"
        required: true
        default: "https://games.hailatat.icu/classicsudoku"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # scripts/e2e.mjs uses only Node built-ins: no npm ci needed.
      - name: E2E
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: node scripts/e2e.mjs "$BASE_URL"
